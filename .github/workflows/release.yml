name: Release to PyPI

on:
  release:
    types: [published]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles
          ref: master
          path: muscles
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-ai
          ref: master
          path: muscles-ai
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-asgi
          ref: master
          path: muscles-asgi
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-wsgi
          ref: master
          path: muscles-wsgi
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-cli
          ref: master
          path: muscles-cli
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-jsonrpc
          ref: master
          path: muscles-jsonrpc
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-mcp
          ref: master
          path: muscles-mcp
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-otel
          ref: master
          path: muscles-otel
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-sql
          ref: master
          path: muscles-sql
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-sse
          ref: master
          path: muscles-sse
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-documents
          ref: master
          path: muscles-documents
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data
          ref: main
          path: muscles-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ./muscles --no-deps
      - run: |
          for package in muscles-ai muscles-asgi muscles-wsgi muscles-cli muscles-jsonrpc muscles-mcp muscles-otel muscles-sql muscles-sse muscles-documents muscles-data; do
            python -m pip install -e "./${package}" --no-deps
          done
      - run: python -m pip install "pytest>=8.0,<9.0" "tomli>=2.0,<3.0" "watchdog>=4,<5" "dnspython==2.6.1" "pyyaml~=6.0" "setuptools==69.0.2" "jsonschema>=4.18,<5" "jinja2==3.1.2" "python-magic==0.4.27" "requests>=2.31.0" "requests-toolbelt>=1.0.0" "werkzeug==2.1.1" "pydantic>=2.7,<3.0" "SQLAlchemy>=2.0,<3.0" "alembic>=1.13,<2.0" "click>=8.1,<9.0"
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python -m pytest -q
      - run: npm install --global pyright
      - run: pyright --pythonpath python src
      - run: python -m build --wheel --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
