name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles
          ref: feature/task-57-core-rc-readiness
          path: muscles
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-ai
          ref: feature/task-66-ai-rc-readiness
          path: muscles-ai
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-asgi
          ref: feature/task-56-ecosystem-rc-readiness
          path: muscles-asgi
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-wsgi
          ref: feature/task-56-ecosystem-rc-readiness
          path: muscles-wsgi
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-cli
          ref: feature/task-56-ecosystem-rc-readiness
          path: muscles-cli
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-jsonrpc
          ref: feature/task-56-ecosystem-rc-readiness
          path: muscles-jsonrpc
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-mcp
          ref: feature/task-56-ecosystem-rc-readiness
          path: muscles-mcp
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-otel
          ref: feature/task-56-ecosystem-rc-readiness
          path: muscles-otel
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-sql
          ref: feature/task-56-ecosystem-rc-readiness
          path: muscles-sql
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-sse
          ref: feature/task-56-ecosystem-rc-readiness
          path: muscles-sse
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-documents
          ref: feature/task-67-documents-rc-readiness
          path: muscles-documents
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data
          ref: feature/task-68-data-rc-readiness
          path: muscles-data
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data-elasticsearch
          ref: feature/task-68-data-rc-readiness
          path: muscles-data-elasticsearch
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data-opensearch
          ref: feature/task-68-data-rc-readiness
          path: muscles-data-opensearch
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data-qdrant
          ref: feature/task-68-data-rc-readiness
          path: muscles-data-qdrant
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data-redis
          ref: feature/task-68-data-rc-readiness
          path: muscles-data-redis
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data-mongodb
          ref: feature/task-68-data-rc-readiness
          path: muscles-data-mongodb
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data-s3
          ref: feature/task-68-data-rc-readiness
          path: muscles-data-s3
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data-sqlalchemy
          ref: feature/task-68-data-rc-readiness
          path: muscles-data-sqlalchemy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ./muscles --no-deps
      - run: |
          for package in muscles-ai muscles-asgi muscles-wsgi muscles-cli muscles-jsonrpc muscles-mcp muscles-otel muscles-sql muscles-sse muscles-documents muscles-data muscles-data-elasticsearch muscles-data-opensearch muscles-data-qdrant muscles-data-redis muscles-data-mongodb muscles-data-s3 muscles-data-sqlalchemy; do
            python -m pip install -e "./${package}" --no-deps
          done
      - run: python -m pip install "watchdog>=4.0" "dnspython==2.6.1" "pyyaml~=6.0" "setuptools==69.0.2" "greenlet==3.0.2" "jsonschema==4.16.0" "jinja2==3.1.2" "python-magic==0.4.27" "requests>=2.31.0" "requests-toolbelt>=1.0.0" "werkzeug==2.1.1" "pydantic>=2.7,<3.0" "SQLAlchemy>=2.0,<3.0" "alembic>=1.13,<2.0" "click>=8.1,<9.0"
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python -m pytest -q
      - run: python -m build --wheel --sdist
