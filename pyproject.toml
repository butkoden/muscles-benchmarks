[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muscles-benchmarks"
version = "1.0.0"
description = "Official benchmark app for Muscles golden path"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["muscles>=1.0.0rc1,<2.0.0"]

[project.urls]
Homepage = "https://github.com/butkoden/muscles-benchmarks"
Repository = "https://github.com/butkoden/muscles-benchmarks"
Documentation = "https://github.com/butkoden/muscles-benchmarks#readme"
PyPI = "https://pypi.org/project/muscles-benchmarks/"
Releases = "https://github.com/butkoden/muscles-benchmarks/releases"
"muscles" = "https://pypi.org/project/muscles/"
"muscles-ai" = "https://pypi.org/project/muscles-ai/"
"muscles-asgi" = "https://pypi.org/project/muscles-asgi/"
"muscles-cli" = "https://pypi.org/project/muscles-cli/"
"muscles-data" = "https://pypi.org/project/muscles-data/"
"muscles-documents" = "https://pypi.org/project/muscles-documents/"
"muscles-jsonrpc" = "https://pypi.org/project/muscles-jsonrpc/"
"muscles-mcp" = "https://pypi.org/project/muscles-mcp/"
"muscles-otel" = "https://pypi.org/project/muscles-otel/"
"muscles-sql" = "https://pypi.org/project/muscles-sql/"
"muscles-sse" = "https://pypi.org/project/muscles-sse/"
"muscles-wsgi" = "https://pypi.org/project/muscles-wsgi/"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "tomli>=2.0,<3.0",
]
ecosystem = [
  "muscles-ai>=0.1.0,<1.0.0",
  "muscles-asgi>=1.0.0,<2.0.0",
  "muscles-cli>=1.0.0,<2.0.0",
  "muscles-data>=0.1.0,<1.0.0",
  "muscles-documents>=0.1.0,<1.0.0",
  "muscles-jsonrpc>=1.0.0,<2.0.0",
  "muscles-mcp>=1.0.0,<2.0.0",
  "muscles-otel>=1.0.0,<2.0.0",
  "muscles-sql>=1.0.0,<2.0.0",
  "muscles-sse>=1.0.0,<2.0.0",
  "muscles-wsgi>=1.0.0,<2.0.0",
]

[project.scripts]
muscles-bench = "muscles_benchmarks.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
